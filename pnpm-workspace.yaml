minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Exact versions adopted before the seven day cutoff during an explicitly requested
  # update to the newest releases. Remove each entry once it ages past the cutoff.
  - 'basic-ftp@6.2.3'
  - '@fallow-cli/darwin-arm64@3.33.0'
  - '@fallow-cli/darwin-x64@3.33.0'
  - '@fallow-cli/linux-arm64-gnu@3.33.0'
  - '@fallow-cli/linux-arm64-musl@3.33.0'
  - '@fallow-cli/linux-x64-gnu@3.33.0'
  - '@fallow-cli/linux-x64-musl@3.33.0'
  - '@fallow-cli/win32-arm64-msvc@3.33.0'
  - '@fallow-cli/win32-x64-msvc@3.33.0'
  - 'fallow-type-aware@3.33.0'
  - 'fallow@3.33.0'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true

overrides:
  basic-ftp: 6.2.3
  handlebars: 4.7.10
  lighthouse: 13.5.0
  proxy-agent: 8.0.2
  qs: 6.16.0
  sharp: 0.35.5
  tmp: 0.2.7
  uuid: 14.0.2
allowBuilds:
  esbuild: true
  workerd: true

auditConfig:
  ignoreGhsas:
    # braces has no patched release. Only semantic-release expands its own trusted glob patterns.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js has no patched release. It is reachable only from the unused js-yaml 3 CLI in @lhci/utils.
    - GHSA-hp3w-g68c-fv3c
