minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true

overrides:
  basic-ftp: 6.2.3
  handlebars: 4.7.10
  lighthouse: 13.5.0
  # miniflare pins undici exactly; 7.30.1 is the patch release that fixes its advisories.
  miniflare>undici: 7.30.1
  proxy-agent: 8.0.2
  qs: 6.16.1
  sharp: 0.35.5
  tmp: 0.2.7
  uuid: 14.0.3
allowBuilds:
  esbuild: true
  workerd: true

auditConfig:
  ignoreGhsas:
    # braces has no patched release. Only semantic-release expands its own trusted glob patterns.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js has no patched release. It is reachable only from the unused js-yaml 3 CLI in @lhci/utils.
    - GHSA-hp3w-g68c-fv3c
