name: Pull request title

# A squash merge turns the title into the commit title on main, where commitlint checks it again
# before any release. Checking it here, with its (#N) suffix, catches problems while they can be
# fixed by editing the title, and runs again on every edit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pull-request-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Squash commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the title a squash merge will use
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | pnpm exec commitlint --verbose
