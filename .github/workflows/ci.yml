name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check pushed commit title
        if: github.event_name == 'push'
        run: git log -1 --pretty=%s | pnpm exec commitlint --verbose
      - name: Run formatting, lint, types, tests, build, bundle, and PWA checks
        run: pnpm run verify
      - name: Audit changed code with Fallow
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec fallow audit --base "$BASE_SHA" --coverage coverage/coverage-final.json
      # Advisories published after a merge would otherwise fail every pull request, even those that
      # leave dependencies alone. Shipped code is always audited, the full tree whenever dependencies
      # change, and the daily dependency audit reports anything published in between.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
      - name: Audit all dependencies when they change
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "Dependencies are unchanged, so the daily dependency audit covers new advisories."
          else
            pnpm audit --audit-level moderate
          fi
      - name: Upload validated production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  browsers:
    name: Playwright browsers
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # Match GitHub's mounted home/workspace owner so Firefox can start.
      options: --ipc=host --user 1001
      volumes:
        - /usr/share/fonts/truetype/dejavu:/usr/share/fonts/truetype/dejavu:ro
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify bundled browsers and screenshot font
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          if command -v fc-cache >/dev/null; then fc-cache -f /usr/share/fonts/truetype/dejavu; fi
          node --input-type=module <<'JS'
          import { chromium, firefox, webkit } from '@playwright/test';
          import { access } from 'node:fs/promises';
          for (const engine of [chromium, firefox, webkit]) {
            await access(engine.executablePath());
            const browser = await engine.launch();
            console.log(engine.name(), browser.version());
            await browser.close();
          }
          JS
      - name: Download validated production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist-${{ github.sha }}
          path: dist
      - name: Run browser tests
        run: pnpm run test:e2e:dist
      - name: Upload Playwright diagnostics and UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
      volumes:
        - /usr/share/fonts/truetype/dejavu:/usr/share/fonts/truetype/dejavu:ro
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download validated production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist-${{ github.sha }}
          path: dist
      - name: Run Lighthouse assertions
        run: |
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath());')"
          export CHROME_PATH
          pnpm exec lhci autorun --config=lighthouserc.json --collect.settings.chromeFlags="--no-sandbox"
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  release:
    name: Semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, browsers, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, browsers, lighthouse, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://affordi.pages.dev
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download validated production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist-${{ github.sha }}
          path: dist
      - name: Verify deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_PROJECT_NAME" || { echo "CLOUDFLARE_PROJECT_NAME is not configured"; exit 1; }
      - name: Upload Pages deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: pnpm exec wrangler pages deploy dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main
      - name: Verify exact production deployment
        run: pnpm check:deployment https://affordi.pages.dev
